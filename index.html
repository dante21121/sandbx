<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game">
        <div id="map"></div>

        <div id="colony-ui">
            <h2>Mi colonia</h2>
            <p>Colonos: <span id="colonist-count">1</span></p>

        <div id="colonist-menu" class="hidden">
            <h3>Colono</h3>

            <button id="move-button">Mover</button>
            <button id="wait-button">Esperar</button>
            <button id="info-button">Información</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
